services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finregrag
      POSTGRES_PASSWORD: finregrag
      POSTGRES_DB: finregrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finregrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      VECTOR_STORE: pgvector
      POSTGRES_DSN: postgresql://finregrag:finregrag@postgres:5432/finregrag
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
