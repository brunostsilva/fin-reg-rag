[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finregrag"
version = "0.1.0"
description = "RAG service for querying financial/payments regulation documents, with pluggable embeddings, vector stores and LLM providers."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "langchain-core>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langchain-openai>=1.7.3",
    "faiss-cpu>=1.15.1",
    "numpy>=1.26",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
