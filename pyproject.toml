[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "finregrag"
version = "0.1.0"
description = "RAG service for querying financial/payments regulation documents, with pluggable embeddings, vector stores and LLM providers."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "langchain-core>=1.7.6",
    "langchain-text-splitters>=1.1.3",
    "langchain-openai>=1.7.4",
    "faiss-cpu>=1.15.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.8",
    "pgvector>=0.5.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# pytest-asyncio warns when this is unset; "function" is its current default made explicit.
asyncio_default_fixture_loop_scope = "function"
